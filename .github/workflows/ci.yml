name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # Tests against the oldest core this plugin declares, the latest release and
    # AttackMap main, then builds sdist + wheel (mlaify/AttackMap#254).
    uses: mlaify/AttackMap/.github/workflows/plugin-ci.yml@main
    with:
      min-core: "0.8.0"
